<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PureForm</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:#f7f4ee;
}

nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 8%;
background:white;
}

.logo img{
height:45px;
}

.nav-links{
display:flex;
gap:25px;
}

.nav-links a{
text-decoration:none;
color:black;
font-weight:600;
}

.hero{
height:85vh;
background:url("Screenshot 2026-11-23 172952.png");
background-size:cover;
background-position:center;
display:flex;
align-items:center;
padding:0 8%;
}

.hero-box{
background:white;
padding:40px;
border-radius:25px;
max-width:500px;
}

.hero h1{
font-size:60px;
line-height:.9;
}

.hero p{
margin:20px 0;
}

button{
padding:15px 30px;
border:none;
border-radius:50px;
background:black;
color:white;
cursor:pointer;
}

.categories{
padding:80px 8%;
display:grid;
grid-template-columns:repeat(4,1fr);
gap:20px;
}

.category{
background:white;
padding:60px;
text-align:center;
border-radius:25px;
font-weight:700;
}

</style>

</head>

<body>

<nav>

<a href="index.html" class="logo">
<img src="Screenshot 2026-11-22 224757.png">
</a>

<div class="nav-links">
<a href="index.html">Home</a>
<a href="shop.html">Shop</a>
<a href="cart.html">Cart</a>
</div>

</nav>

<section class="hero">

<div class="hero-box">

<h1>Elevated Essentials</h1>

<p>
Built for movement.
Designed for everyday life.
</p>

<a href="shop.html">
<button>
SHOP NOW
</button>
</a>

</div>

</section>

<section class="categories">

<div class="category">SHIRTS</div>
<div class="category">HOODIES</div>
<div class="category">JOGGERS</div>
<div class="category">SWEATERS</div>

</section>

</body>
</html>
