<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PureForm</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#f6f2ea;
color:#222;
}

nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 8%;
background:white;
}

nav img{
height:50px;
}

.links{
display:flex;
gap:30px;
}

.links a{
text-decoration:none;
color:#222;
font-weight:600;
}

.cart{
background:#222;
color:white;
padding:10px 20px;
border-radius:999px;
}

.hero{
display:grid;
grid-template-columns:1fr 1fr;
align-items:center;
padding:50px 8%;
gap:50px;
}

.hero-text h1{
font-size:80px;
line-height:.95;
margin-bottom:20px;
}

.hero-text p{
font-size:20px;
color:#666;
margin-bottom:30px;
}

.hero-text button{
background:#222;
color:white;
border:none;
padding:18px 35px;
border-radius:999px;
font-size:18px;
cursor:pointer;
}

.hero-image img{
width:100%;
border-radius:30px;
}

.products{
padding:50px 8%;
}

.products h2{
font-size:42px;
margin-bottom:25px;
}

.product-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:25px;
}

.card{
background:white;
padding:20px;
border-radius:25px;
}

.card img{
width:100%;
border-radius:15px;
margin-bottom:15px;
}

.price{
font-weight:700;
margin-top:10px;
}

@media(max-width:900px){

.hero{
grid-template-columns:1fr;
}

.hero-text h1{
font-size:55px;
}

.links{
display:none;
}

}

</style>

</head>

<body>

<nav>

<img src="Screenshot 2026-11-23 172952.png">

<div class="links">
<a href="#">Home</a>
<a href="#">Shop</a>
<a href="#">About</a>
</div>

<div class="cart">
🛒 0
</div>

</nav>

<section class="hero">

<div class="hero-text">

<h1>
Move Better.
<br>
Look Better.
<br>
Perform Better.
</h1>

<p>
Premium athletic wear engineered for comfort,
performance and everyday movement.
</p>

<button>
Shop Collection
</button>

</div>

<div class="hero-image">

<img src="Screenshot 2026-11-23 172952.png">

</div>

</section>

<section class="products">

<h2>Featured Collection</h2>

<div class="product-grid">

<div class="card">
<img src="Screenshot 2026-11-23 172952.png">
<h3>PureForm Tee</h3>
<div class="price">$34.99</div>
</div>

<div class="card">
<img src="Screenshot 2026-11-23 172952.png">
<h3>Essential Tee</h3>
<div class="price">$34.99</div>
</div>

<div class="card">
<img src="Screenshot 2026-11-23 172952.png">
<h3>Premium Tee</h3>
<div class="price">$39.99</div>
</div>

</div>

</section>

</body>
</html>
