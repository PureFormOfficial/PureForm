<!DOCTYPE html>
<html>
<head>
<title>PureForm</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#f7f4ee;
}

nav{
display:flex;
justify-content:space-between;
padding:20px 7%;
background:white;
}

.hero{
height:80vh;
background:url("Screenshot 2026-11-23 172952.png");
background-size:cover;
background-position:center;
display:flex;
align-items:center;
padding:0 7%;
}

.hero-content{
background:white;
padding:40px;
border-radius:25px;
max-width:500px;
}

.hero h1{
font-size:65px;
line-height:.9;
}

.hero p{
margin:20px 0;
}

.hero button{
padding:15px 30px;
border:none;
background:black;
color:white;
border-radius:50px;
cursor:pointer;
}

.categories{
padding:80px 7%;
display:grid;
grid-template-columns:repeat(4,1fr);
gap:20px;
}

.category{
background:white;
padding:80px 20px;
text-align:center;
border-radius:25px;
font-weight:700;
}

footer{
padding:50px;
text-align:center;
}

a{
text-decoration:none;
color:black;
}
</style>
</head>

<body>

<nav>

<img src="Screenshot 2026-11-22 224757.png" height="45">

<div>
<a href="shop.html">SHOP</a>
</div>

</nav>

<section class="hero">

<div class="hero-content">

<h1>
Elevated Essentials
</h1>

<p>
Built for movement.
Designed for everyday life.
</p>

<a href="shop.html">
<button>
SHOP NOW
</button>
</a>

</div>

</section>

<section class="categories">

<div class="category">SHIRTS</div>
<div class="category">HOODIES</div>
<div class="category">JOGGERS</div>
<div class="category">SWEATERS</div>

</section>

<footer>

© PureForm

</footer>

</body>
</html>
