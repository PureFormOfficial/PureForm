<!DOCTYPE html>
<html>
<head>

<title>Shop</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
font-family:Poppins;
box-sizing:border-box;
}

body{
padding:30px;
background:#f7f4ee;
}

nav{
display:flex;
justify-content:space-between;
margin-bottom:30px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.card{
background:white;
padding:20px;
border-radius:20px;
}

.card img{
width:100%;
border-radius:15px;
}

button{
width:100%;
padding:12px;
border:none;
background:black;
color:white;
border-radius:50px;
cursor:pointer;
}

input{
width:100%;
padding:15px;
margin:20px 0;
}

a{
text-decoration:none;
color:black;
}

</style>

</head>

<body>

<nav>

<a href="index.html">
<img src="Screenshot 2026-11-22 224757.png" height="45">
</a>

<a href="cart.html">
🛒 Cart
</a>

</nav>

<h1>Shop Collection</h1>

<input
type="text"
id="search"
placeholder="Search products...">

<div class="grid" id="products">

<div class="card">
<img src="Screenshot 2026-11-23 172952.png">
<h3>Performance Tee</h3>
<p>$34.99</p>
<button onclick="addToCart('Performance Tee',34.99)">
Add To Cart
</button>
</div>

<div class="card">
<img src="Screenshot 2026-11-23 172952.png">
<h3>Core Hoodie</h3>
<p>$59.99</p>
<button onclick="addToCart('Core Hoodie',59.99)">
Add To Cart
</button>
</div>

<div class="card">
<img src="Screenshot 2026-11-23 172952.png">
<h3>Joggers</h3>
<p>$44.99</p>
<button onclick="addToCart('Joggers',44.99)">
Add To Cart
</button>
</div>

<div class="card">
<img src="Screenshot 2026-11-23 172952.png">
<h3>Sweater</h3>
<p>$49.99</p>
<button onclick="addToCart('Sweater',49.99)">
Add To Cart
</button>
</div>

</div>

<script src="script.js"></script>

<script>

document
.getElementById("search")
.addEventListener("keyup",function(){

let search =
this.value.toLowerCase();

let cards =
document.querySelectorAll(".card");

cards.forEach(card=>{

let text =
card.innerText.toLowerCase();

card.style.display =
text.includes(search)
? "block"
: "none";

});

});

</script>

</body>
</html>
