<!DOCTYPE html>
<html>
<head>

<title>Cart</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

body{
font-family:Poppins;
padding:40px;
background:#f7f4ee;
}

.item{
background:white;
padding:15px;
margin-bottom:10px;
border-radius:15px;
}

</style>

</head>

<body>

<a href="index.html">
Home
</a>

<h1>Your Cart</h1>

<div id="cartItems"></div>

<h2>
Total:
$<span id="total">0</span>
</h2>

<script>

let cart =
JSON.parse(
localStorage.getItem("pureformCart")
) || [];

let html = "";
let total = 0;

cart.forEach(item=>{

html += `
<div class="item">
${item.name}
-
$${item.price}
</div>
`;

total += item.price;

});

document.getElementById(
"cartItems"
).innerHTML = html;

document.getElementById(
"total"
).innerText = total.toFixed(2);

</script>

</body>
</html>
